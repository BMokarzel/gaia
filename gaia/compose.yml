services:
  postgres:
    image: postgres:16
    container_name: gaia-postgres
    environment:
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: gaia
      POSTGRES_DB: gaia
    ports:
      - "5432:5432"
    volumes:
      - gaia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gaia_pg:
